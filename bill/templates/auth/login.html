<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Vetri Bills</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2B2B2B',
                        secondary: { DEFAULT: '#F97316', dark: '#EA580C' },
                        textmain: '#111827',
                        bgmain: '#F3F4F6',
                        stroke: '#D3D3D3',
                        danger: '#FF0000',
                    },
                    fontFamily: {
                        heading: ['Montserrat', 'sans-serif'],
                        body: ['Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        h1, h2, h3, h4, h5, h6 { font-family: 'Montserrat', sans-serif; }
        body { font-family: 'Roboto', sans-serif; }

        .role-radio:checked + div {
            border-color: #F97316;
            color: #F97316;
        }
        .role-radio:checked + div span.font-bold {
            color: #F97316;
        }
    </style>
</head>

{% if site_settings.login_bg_image %}
<body style="background-image: url('{{ site_settings.login_bg_image.url }}');
             background-size: cover;
             background-position: center;
             background-repeat: no-repeat;"
      class="min-h-screen flex items-center justify-center px-4 py-12 relative overflow-x-hidden">
{% else %}
<body style="background-color: {{ site_settings.login_bg_color }};"
      class="min-h-screen flex items-center justify-center px-4 py-12 relative overflow-x-hidden">
{% endif %}

    <!-- Decorative blobs -->
    <div class="absolute top-[-10%] left-[-5%] w-96 h-96 bg-gray-700 rounded-full mix-blend-multiply filter blur-3xl opacity-50 pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-5%] w-96 h-96 bg-gray-800 rounded-full mix-blend-multiply filter blur-3xl opacity-50 pointer-events-none"></div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 relative z-10 my-auto">

        <!-- Logo & Brand -->
        <div class="text-center mb-8">
            <div class="flex items-center justify-center gap-3 mb-4">
                {% if site_settings.login_logo %}
                    <img src="{{ site_settings.login_logo.url }}"
                         alt="Logo"
                         class="h-10 w-10 object-contain rounded-lg">
                {% endif %}
                <h1 class="text-3xl font-bold font-heading text-textmain">
                    vetri<span class="text-secondary text-sm ml-1 align-top relative top-1">bills</span>
                </h1>
            </div>
            <h2 class="text-2xl font-bold font-heading text-textmain flex justify-center items-center gap-2 mt-4">
                Welcome Back! <span class="text-3xl">👋</span>
            </h2>
        </div>

        <!-- Error -->
        {% if error %}
        <div class="bg-red-50 border-l-4 border-danger p-4 mb-6 rounded">
            <p class="text-sm text-danger font-medium">{{ error }}</p>
        </div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}

            <!-- Role Selector -->
            <p class="text-sm text-center text-textmain font-bold mb-4">Join As a,</p>

            <div class="grid grid-cols-2 gap-3 mb-6">
                <label class="cursor-pointer">
                    <input type="radio" name="role" value="admin" class="role-radio hidden" checked>
                    <div class="border border-stroke text-gray-500 rounded-lg p-3 flex items-center justify-center transition-colors">
                        <span class="mr-2 text-lg">👑</span>
                        <span class="font-bold text-sm">Admin</span>
                    </div>
                </label>
                <label class="cursor-pointer">
                    <input type="radio" name="role" value="cashier" class="role-radio hidden">
                    <div class="border border-stroke text-gray-500 rounded-lg p-3 flex items-center justify-center transition-colors">
                        <span class="mr-2 text-lg">🧑‍💻</span>
                        <span class="font-bold text-sm">Cashier</span>
                    </div>
                </label>
            </div>

            <!-- Username -->
            <div class="mb-4">
                <label class="block text-sm font-bold text-textmain mb-2" for="email">
                    User Name*
                </label>
                <input type="text" id="email" name="email"
                       placeholder="User ID" required
                       class="w-full bg-bgmain border border-stroke text-textmain py-3 px-4 rounded-lg
                              focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors">
            </div>

            <!-- Password -->
            <div class="mb-2">
                <label class="block text-sm font-bold text-textmain mb-2" for="password">
                    Password*
                </label>
                <div class="relative">
                    <input type="password" id="password" name="password"
                           placeholder="Enter Password" required
                           class="w-full bg-bgmain border border-stroke text-textmain py-3 px-4 rounded-lg
                                  focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors">
                    <span id="togglePassword"
                          onclick="togglePasswordVisibility()"
                          class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 transition-colors cursor-pointer">
                        <!-- Eye icon -->
                        <svg id="eyeIcon" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7
                                     -1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                        <!-- Eye-off icon -->
                        <svg id="eyeOffIcon" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7
                                     a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243
                                     M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29
                                     m7.532 7.532l3.29 3.29M3 3l3.59 3.59
                                     m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7
                                     a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                        </svg>
                    </span>
                </div>
            </div>

            <!-- Forgot Password -->
            {% comment %} <div class="flex justify-end mb-6">
                <a href="#" class="text-sm text-secondary hover:text-secondary-dark font-medium transition-colors">
                    Forget Password?
                </a>
            </div> {% endcomment %}

            <!-- Submit -->
            <button type="submit"
                    class="w-full bg-secondary hover:bg-secondary-dark text-white font-bold py-3 px-4
                           rounded-lg transition-colors shadow-md">
                Login
            </button>
        </form>
    </div>

    <script>
        function togglePasswordVisibility() {
            const pwdInput   = document.getElementById('password');
            const eyeIcon    = document.getElementById('eyeIcon');
            const eyeOffIcon = document.getElementById('eyeOffIcon');

            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.classList.add('hidden');
                eyeOffIcon.classList.remove('hidden');
            } else {
                pwdInput.type = 'password';
                eyeIcon.classList.remove('hidden');
                eyeOffIcon.classList.add('hidden');
            }
        }
    </script>

</body>
</html>
